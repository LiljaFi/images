[www]
user = container
group = container
listen = /tmp/php-fpm.sock
listen.owner = container
listen.group = container
listen.mode = 0660

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = no
catch_workers_output = yes
