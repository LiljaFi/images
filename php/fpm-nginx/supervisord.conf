[supervisord]
nodaemon=true
logfile=/home/container/logs/supervisord.log
pidfile=/home/container/tmp/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize --fpm-config /home/container/php-fpm.conf
autostart=true
autorestart=true
stdout_logfile=/home/container/logs/php-fpm.log
stderr_logfile=/home/container/logs/php-fpm-error.log

[program:nginx]
command=/usr/sbin/nginx -c /home/container/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/home/container/logs/nginx.log
stderr_logfile=/home/container/logs/nginx-error.log
