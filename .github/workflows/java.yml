name: build java
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"
  push:
    branches:
      - master
    paths:
      - java/**
jobs:
  push:
    java:
      name: "liljafi:java_${{ matrix.tag }}"
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        matrix:
          tag:
            - 8
            - 8j9
            - 11
            - 11j9
            - 16
            - 17
            - 17j9
            - 17graalvm
            - 18
            - 18j9
            - 18graalvm
            - 19
            - 19j9
            - 19graalvm
            - 21
            - 21j9
            - 21graalvm
            - 22
            - 22j9
            - 22graalvm
      steps:
        - uses: actions/checkout@v3
        - uses: docker/setup-qemu-action@v2
        - uses: docker/setup-buildx-action@v2
          with:
            buildkitd-flags: --debug
        - uses: docker/login-action@v2
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.REGISTRY_TOKEN }}
        - uses: docker/build-push-action@v4
          with:
            context: ./java
            file: ./java/${{ matrix.tag }}/Dockerfile
            platforms: linux/amd64
            push: true
            tags: |
              ghcr.io/liljafi/yolks:java_${{ matrix.tag }}
    php:
      name: "liljafi:php_${{ matrix.tag }}"
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        matrix:
          tag:
            - cli
            - composer
            - fpm-nginx
      steps:
        - uses: actions/checkout@v3
        - uses: docker/setup-qemu-action@v2
        - uses: docker/setup-buildx-action@v2
          with:
            buildkitd-flags: --debug
        - uses: docker/login-action@v2
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.REGISTRY_TOKEN }}
        - uses: docker/build-push-action@v4
          with:
            context: ./php/${{ matrix.tag }}
            file: ./php/${{ matrix.tag }}/Dockerfile
            platforms: linux/amd64
            push: true
            tags: |
              ghcr.io/liljafi/yolks:php_${{ matrix.tag }}